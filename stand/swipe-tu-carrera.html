<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Swipe tu carrera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Kiosco: una pila de tarjetas centrada sobre fondo azul UTEC; resultado a dos columnas. Look único (no cambia con el tema). */
:root {
  --bg: #0a7cac;
  --bg-deep: #075e82;
  --card: #ffffff;
  --ink: #101014;
  --muted: #5b6270;
  --orange: #f2661c;
  --purple: #5b2c82;
  --on-bg: #ffffff;
  --on-bg-muted: #cdeefa;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font); color: var(--on-bg); overflow: hidden;
  background: radial-gradient(120% 90% at 50% 0%, var(--bg) 0%, var(--bg-deep) 100%) var(--bg-deep);
  user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
.app { height: 100%; display: flex; flex-direction: column; padding: 16px clamp(16px, 3vw, 40px); gap: 12px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .85rem; color: var(--on-bg-muted); }
.brand { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--on-bg); }
.brand b { color: var(--orange); }
.linkbtn { background: none; border: 1px solid rgba(255,255,255,.3); color: var(--on-bg-muted); border-radius: 999px; padding: 4px 12px; font-size: .8rem; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 2.5vh, 28px); }
.screen[hidden] { display: none !important; }

/* Atracción */
.hero { font-size: clamp(2.4rem, 7vw, 5.5rem); font-weight: 800; line-height: 1; margin: 0; text-align: center; text-wrap: balance; }
.hero em { font-style: normal; color: var(--orange); background: var(--card); padding: 0 .18em; border-radius: .15em; }
.sub { margin: 0; color: var(--on-bg-muted); font-size: clamp(1rem, 2vw, 1.4rem); text-align: center; max-width: 36ch; }
.fan { position: relative; width: min(300px, 70vw); height: clamp(150px, 26vh, 230px); }
.fan div { position: absolute; inset: 0; background: var(--card); color: var(--ink); border-radius: 22px; box-shadow: 0 16px 40px -18px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; font-size: 3.4rem; animation: fan 3.6s ease-in-out infinite; }
.fan div:nth-child(1) { transform: rotate(-10deg); } .fan div:nth-child(2) { transform: rotate(6deg); animation-delay: .3s; }
.fan div:nth-child(3) { animation: swipeDemo 3.6s ease-in-out infinite; }
@keyframes fan { 50% { translate: 0 -6px; } }
@keyframes swipeDemo { 0%, 30% { transform: none; opacity: 1; } 55% { transform: translateX(140%) rotate(20deg); opacity: 0; } 56%, 70% { transform: none; opacity: 0; } 100% { opacity: 1; } }
.big-btn { white-space: nowrap; border: 0; border-radius: 999px; padding: 20px 48px; background: var(--orange); color: #fff; font-size: clamp(1.2rem, 2.4vw, 1.7rem); font-weight: 800; box-shadow: 0 10px 0 #a63f0b; }
.big-btn:active { transform: translateY(6px); box-shadow: 0 4px 0 #a63f0b; }
.big-btn.light { background: var(--card); color: var(--ink); box-shadow: 0 10px 0 rgba(0,0,0,.25); }

/* Preguntas */
.progress { display: flex; gap: 6px; width: min(560px, 100%); }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); }
.progress i.done { background: var(--card); }
.deck { position: relative; width: min(520px, 100%); flex: 1; max-height: 560px; min-height: 260px; }
.card {
  position: absolute; inset: 0; background: var(--card); color: var(--ink); border-radius: 28px; padding: clamp(22px, 4vw, 40px);
  display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
  box-shadow: 0 24px 50px -24px rgba(0,0,0,.55); touch-action: none; will-change: transform;
}
.card.behind { transform: scale(.94) translateY(18px); opacity: .7; }
.card .num { font-size: .85rem; font-weight: 600; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.card .icon { font-size: clamp(4rem, 12vh, 7rem); line-height: 1; }
.card h2 { margin: 0; font-size: clamp(1.5rem, 3.6vw, 2.4rem); line-height: 1.12; font-weight: 800; text-wrap: balance; }
.stamp { position: absolute; top: 72px; padding: 6px 16px; border: 5px solid; border-radius: 12px; font-weight: 800; font-size: 1.8rem; opacity: 0; letter-spacing: .06em; }
.stamp.yes { left: 24px; color: var(--orange); border-color: var(--orange); transform: rotate(-12deg); }
.stamp.no { right: 24px; color: var(--muted); border-color: var(--muted); transform: rotate(12deg); }
.choices { display: flex; gap: clamp(24px, 6vw, 60px); align-items: center; }
.choice { width: clamp(76px, 10vw, 96px); aspect-ratio: 1; border-radius: 50%; border: 0; font-size: 1rem; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 8px 0 rgba(0,0,0,.2); }
.choice span { font-size: 2rem; line-height: 1; }
.choice.no { background: var(--card); color: var(--muted); }
.choice.yes { background: var(--orange); color: #fff; }
.choice:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.swipe-hint { color: var(--on-bg-muted); font-size: .9rem; margin: 0; }

/* Resultado */
#s-result { flex-direction: row; gap: clamp(20px, 4vw, 48px); align-items: center; justify-content: center; }
@media (max-width: 820px), (orientation: portrait) { #s-result { flex-direction: column; align-items: center; overflow-y: auto; justify-content: flex-start; } }
.res-main { background: var(--card); color: var(--ink); border-radius: 28px; padding: clamp(22px, 4vw, 40px); width: min(620px, 100%); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.res-main .eyebrow { margin: 0; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.res-main h2 { margin: 0; font-size: clamp(1.8rem, 4.2vw, 3rem); line-height: 1.05; font-weight: 800; text-wrap: balance; }
.match { display: flex; align-items: center; gap: 14px; }
.match .pct { font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 800; color: var(--orange); font-variant-numeric: tabular-nums; line-height: 1; }
.match .meter { flex: 1; height: 14px; background: #e4e9f0; border-radius: 7px; overflow: hidden; }
.match .meter div { height: 100%; background: var(--orange); border-radius: 7px; width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); }
.res-main p { margin: 0; color: var(--muted); font-size: 1.05rem; max-width: 52ch; }
.why { display: flex; flex-wrap: wrap; gap: 8px; }
.why span { background: #f4f8fb; border: 1px solid #e4e9f0; border-radius: 999px; padding: 6px 12px; font-size: .85rem; color: var(--ink); }
.also { border-top: 1px solid #e4e9f0; padding-top: 14px; font-size: .95rem; color: var(--muted); }
.also strong { color: var(--ink); }
.res-side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; width: min(300px, 100%); text-align: center; }
.qr { background: var(--card); padding: 16px; border-radius: 22px; width: 100%; max-width: 240px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; color: var(--ink); font-size: .9rem; }
.qr img, .qr canvas { width: 100% !important; height: auto !important; display: block; }
.res-side p { margin: 0; color: var(--on-bg-muted); }
.res-side strong { color: var(--on-bg); }
.reset-note { font-size: .85rem; color: var(--on-bg-muted); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .fan div { animation: none !important; } }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <span class="brand">UTEC <b>·</b> Swipe tu carrera</span>
    <button class="linkbtn" id="fsBtn" type="button">Pantalla completa</button>
  </div>

  <section class="screen" id="s-attract">
    <div class="fan" aria-hidden="true"><div>🤖</div><div>🌱</div><div>🎷</div></div>
    <h1 class="hero">¿Qué carrera <em>va con vos</em>?</h1>
    <p class="sub">Son 10 tarjetas. Deslizá a la derecha si te identificás y a la izquierda si no. Tardás menos de un minuto.</p>
    <button class="big-btn" id="startBtn" type="button">Empezar</button>
  </section>

  <section class="screen" id="s-quiz" hidden>
    <div class="progress" id="progress"></div>
    <div class="deck" id="deck"></div>
    <div class="choices">
      <button class="choice no" id="noBtn" type="button"><span>✕</span>No</button>
      <button class="choice yes" id="yesBtn" type="button"><span>♥</span>Sí</button>
    </div>
    <p class="swipe-hint">Deslizá la tarjeta o tocá los botones</p>
  </section>

  <section class="screen" id="s-result" hidden>
    <div class="res-main">
      <p class="eyebrow">Tu carrera UTEC podría ser</p>
      <h2 id="resName"></h2>
      <div class="match"><span class="pct" id="resPct">0%</span><div class="meter"><div id="resMeter"></div></div></div>
      <p id="resDesc"></p>
      <div class="why" id="resWhy"></div>
      <div class="also" id="resAlso"></div>
    </div>
    <div class="res-side">
      <div class="qr" id="qr"></div>
      <p><strong>Escaneá con tu celular</strong><br>y llevate la info de la carrera</p>
      <button class="big-btn light" id="againBtn" type="button">Jugar otra vez</button>
      <span class="reset-note" id="resetNote"></span>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  // ====== CONTENIDO EDITABLE ======
  // Validar nombres, descripciones y links con UTEC antes de la feria.
  const CAREERS = {
    meca:  { name: 'Ingeniería en Mecatrónica',            url: 'https://utec.edu.uy/', desc: 'Diseñás y construís máquinas inteligentes: robots, automatismos y sistemas que mezclan mecánica, electrónica y software.' },
    renov: { name: 'Ingeniería en Energías Renovables',    url: 'https://utec.edu.uy/', desc: 'Trabajás con energía solar, eólica y biomasa para producir energía limpia y hacerla más eficiente.' },
    logi:  { name: 'Ingeniería en Logística',              url: 'https://utec.edu.uy/', desc: 'Organizás cómo se mueven los productos, desde el campo o la fábrica hasta el puerto y el cliente, para que todo llegue a tiempo.' },
    agro:  { name: 'Ingeniería Agroambiental',             url: 'https://utec.edu.uy/', desc: 'Buscás que la producción agropecuaria sea rentable y cuide el suelo, el agua y el ambiente.' },
    bio:   { name: 'Ingeniería Biomédica',                 url: 'https://utec.edu.uy/', desc: 'Aplicás la tecnología a la salud: equipos médicos, sensores y dispositivos que ayudan a diagnosticar y tratar.' },
    ti:    { name: 'Lic. en Tecnologías de la Información', url: 'https://utec.edu.uy/', desc: 'Programás, diseñás sistemas y trabajás con datos e inteligencia artificial para resolver problemas reales.' },
    alim:  { name: 'Lic. en Análisis Alimentario',         url: 'https://utec.edu.uy/', desc: 'Investigás en el laboratorio qué tienen los alimentos y cómo asegurar que sean seguros y de calidad.' },
    jazz:  { name: 'Lic. en Jazz y Música Creativa',       url: 'https://utec.edu.uy/', desc: 'Tocás, componés, improvisás y producís música combinando tradición y tecnología.' },
    leche: { name: 'Tecnólogo en Producción Lechera',      url: 'https://utec.edu.uy/', desc: 'Gestionás tambos: bienestar animal, calidad de la leche y tecnología aplicada al campo.' },
  };
  // Cada pregunta suma puntos a una o más carreras si la respuesta es "Sí".
  const QUESTIONS = [
    { icon: '🔧', text: '¿Te gusta desarmar cosas para ver cómo funcionan?',       tag: 'Curiosidad técnica', w: { meca: 3, bio: 1, renov: 1 } },
    { icon: '💻', text: '¿Podrías pasar horas programando una app o un juego?',     tag: 'Programar',          w: { ti: 3, meca: 1 } },
    { icon: '🌾', text: '¿Te imaginás trabajando al aire libre, en el campo?',       tag: 'Campo',              w: { agro: 3, leche: 2, renov: 1 } },
    { icon: '☀️', text: '¿Te preocupa el cambio climático y de dónde sale la energía?', tag: 'Ambiente',         w: { renov: 3, agro: 2 } },
    { icon: '📦', text: '¿Sos quien organiza todo: viajes, eventos, horarios?',     tag: 'Organizar',          w: { logi: 3, ti: 1 } },
    { icon: '🫀', text: '¿Te interesa la salud y cómo funciona el cuerpo humano?', tag: 'Salud',              w: { bio: 3, alim: 1 } },
    { icon: '🧪', text: '¿Te gusta el laboratorio: medir, probar, experimentar?',    tag: 'Laboratorio',        w: { alim: 3, bio: 2, renov: 1 } },
    { icon: '🎷', text: '¿La música es parte de tu vida: tocás, cantás o producís?', tag: 'Música',             w: { jazz: 4 } },
    { icon: '🐄', text: '¿Te gusta trabajar con animales?',                         tag: 'Animales',           w: { leche: 3, agro: 1 } },
    { icon: '🤖', text: '¿Te fascinan los robots y las máquinas que funcionan solas?', tag: 'Robótica',         w: { meca: 3, logi: 1, ti: 1 } },
  ];
  const RESULT_RESET_S = 30, IDLE_MS = 40000;
  // ================================

  const $ = id => document.getElementById(id);
  let current = 's-attract';
  function show(id) { ['s-attract', 's-quiz', 's-result'].forEach(s => $(s).hidden = s !== id); current = id; }

  const MAX = {}; Object.keys(CAREERS).forEach(k => MAX[k] = QUESTIONS.reduce((a, q) => a + (q.w[k] || 0), 0));
  let idx = 0, answers = [], busy = false;

  function renderProgress() { $('progress').innerHTML = QUESTIONS.map((_, i) => `<i class="${i < idx ? 'done' : ''}"></i>`).join(''); }
  function cardEl(i) {
    const q = QUESTIONS[i], el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="num">${i + 1} / ${QUESTIONS.length}</div><div class="icon">${q.icon}</div><h2>${q.text}</h2><div class="stamp yes">SÍ</div><div class="stamp no">NO</div>`;
    return el;
  }
  function renderDeck() {
    const deck = $('deck'); deck.innerHTML = '';
    if (idx + 1 < QUESTIONS.length) { const b = cardEl(idx + 1); b.classList.add('behind'); deck.appendChild(b); }
    if (idx < QUESTIONS.length) { const top = cardEl(idx); deck.appendChild(top); bindDrag(top); }
    renderProgress();
  }

  function bindDrag(card) {
    let sx = 0, sy = 0, dx = 0, dragging = false, t0 = 0;
    const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
    card.addEventListener('pointerdown', e => { if (busy) return; dragging = true; sx = e.clientX; sy = e.clientY; t0 = performance.now(); card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
    card.addEventListener('pointermove', e => {
      if (!dragging) return; dx = e.clientX - sx; const dy = (e.clientY - sy) * .3;
      card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 18}deg)`;
      yes.style.opacity = Math.max(0, Math.min(1, dx / 110)); no.style.opacity = Math.max(0, Math.min(1, -dx / 110));
    });
    const end = () => {
      if (!dragging) return; dragging = false;
      const v = Math.abs(dx) / Math.max(1, performance.now() - t0);
      if (Math.abs(dx) > 110 || (Math.abs(dx) > 50 && v > .6)) answer(dx > 0, card);
      else { card.style.transition = 'transform .25s'; card.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0; }
      dx = 0;
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  }

  function answer(yes, card) {
    if (busy || idx >= QUESTIONS.length) return; busy = true;
    card = card || $('deck').lastElementChild;
    card.querySelector(yes ? '.stamp.yes' : '.stamp.no').style.opacity = 1;
    card.style.transition = 'transform .35s ease-in, opacity .35s';
    card.style.transform = `translateX(${yes ? 130 : -130}vw) rotate(${yes ? 28 : -28}deg)`;
    answers[idx] = yes;
    setTimeout(() => { idx++; busy = false; if (idx >= QUESTIONS.length) showResult(); else renderDeck(); }, 320);
  }

  function showResult() {
    const score = {}; Object.keys(CAREERS).forEach(k => score[k] = 0);
    const why = {};
    QUESTIONS.forEach((q, i) => { if (!answers[i]) return; for (const k in q.w) { score[k] += q.w[k]; (why[k] = why[k] || []).push(q.tag); } });
    // Gana la carrera con más puntos (si no, las que tienen pocas preguntas llegan al 100% con un solo "sí").
    // El % muestra qué parte del perfil de esa carrera marcaste.
    const ranked = Object.keys(CAREERS).map(k => ({ k, r: score[k] / MAX[k], s: score[k] })).sort((a, b) => b.s - a.s || b.r - a.r);
    const best = ranked[0], second = ranked[1];
    show('s-result');
    if (best.s === 0) {
      $('resName').textContent = 'Todavía no hay un match claro';
      $('resPct').textContent = '—'; $('resMeter').style.width = '0';
      $('resDesc').textContent = 'Pasa seguido: nada de esto te llamó del todo. Hablá con alguien del stand y te contamos todas las carreras de UTEC.';
      $('resWhy').innerHTML = ''; $('resAlso').innerHTML = '';
      renderQR('https://utec.edu.uy/');
    } else {
      const c = CAREERS[best.k], pct = Math.round(best.r * 100);
      $('resName').textContent = c.name; $('resDesc').textContent = c.desc;
      $('resWhy').innerHTML = (why[best.k] || []).map(t => `<span>✓ ${t}</span>`).join('');
      $('resAlso').innerHTML = second.s > 0 ? `También podría ir con vos: <strong>${CAREERS[second.k].name}</strong> (${Math.round(second.r * 100)}%)` : '';
      let n = 0; const step = () => { n = Math.min(pct, n + 3); $('resPct').textContent = n + '%'; if (n < pct) requestAnimationFrame(step); }; step();
      requestAnimationFrame(() => $('resMeter').style.width = pct + '%');
      renderQR(c.url);
    }
    let n = RESULT_RESET_S; $('resetNote').textContent = `Vuelve al inicio en ${n} s`;
    clearInterval(resetTimer);
    resetTimer = setInterval(() => { n--; $('resetNote').textContent = `Vuelve al inicio en ${n} s`; if (n <= 0) resetAll(); }, 1000);
  }
  function renderQR(url) {
    const box = $('qr'); box.innerHTML = '';
    if (window.QRCode) new QRCode(box, { text: url, width: 256, height: 256, colorDark: '#101014', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    else box.textContent = url.replace('https://', '');
  }

  let resetTimer = null;
  function start() { idx = 0; answers = []; busy = false; show('s-quiz'); renderDeck(); }
  function resetAll() { clearInterval(resetTimer); idx = 0; answers = []; show('s-attract'); }

  $('startBtn').addEventListener('click', async () => { try { await navigator.wakeLock?.request('screen'); } catch (_) {} start(); });
  $('yesBtn').addEventListener('click', () => answer(true));
  $('noBtn').addEventListener('click', () => answer(false));
  $('againBtn').addEventListener('click', () => { clearInterval(resetTimer); start(); });
  $('fsBtn').addEventListener('click', () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (_) {} });
  addEventListener('keydown', e => { if (current !== 's-quiz') return; if (e.key === 'ArrowRight') answer(true); if (e.key === 'ArrowLeft') answer(false); });
  let lastTouch = Date.now();
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => lastTouch = Date.now(), true));
  setInterval(() => { if (current === 's-quiz' && Date.now() - lastTouch > IDLE_MS) resetAll(); }, 2000);
})();
</script>
</body>
</html>
